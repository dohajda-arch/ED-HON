<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3d">
<link rel="manifest" href="manifest.webmanifest">
<title>Platby Edennium</title>
<style>
:root{--green:#1f4d3d;--bg:#f5f5f2;--card:#fff;--line:#d7d7d1}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#161616}
main{max-width:720px;margin:auto;padding:18px}.card{background:var(--card);padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001}
h1{margin:0 0 6px;color:var(--green)}.muted{color:#666;margin:0 0 20px}
label{display:block;font-weight:700;margin-top:14px;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint,.notice{font-size:14px;color:#555;margin-top:7px}
canvas{width:100%;height:170px;border:2px dashed #999;border-radius:8px;background:#fff;touch-action:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1;min-width:190px}
button{padding:13px 16px;border:0;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:white}.secondary{background:#e9e9e4;color:#111}.danger{background:#eee}
#statusBox{display:none;background:#eef6f1;border-radius:8px;padding:10px;margin-top:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main><div class="card">
<h1>Platby Edennium</h1>
<p class="muted">Potvrzení o platbě / doklad k podpisu</p>

<label>Číslo dokladu</label><input id="docNo" placeholder="např. ED-2026-001">
<label>Příjemce</label><input id="name" placeholder="Jméno a příjmení / název">
<label>Účel platby</label><textarea id="purpose" rows="2" placeholder="Např. honorář za vystoupení"></textarea>

<div class="grid">
<div><label>Částka (Kč)</label><input id="amount" inputmode="decimal" placeholder="3000"></div>
<div><label>Stav platby</label>
<select id="paymentStatus">
<option value="cash_paid">Hotově – vyplaceno</option>
<option value="transfer_pending">Bankovním převodem – k vyplacení</option>
<option value="transfer_paid">Bankovním převodem – vyplaceno</option>
</select></div></div>
<div id="statusHint" class="hint"></div>

<label id="dateLabel">Datum vyplacení</label><input id="payDate" type="date">

<label>Osoba jednající za Edennium, z.s.</label>
<select id="issuer"><option value="">Vyberte osobu</option><option>Předseda</option><option>Místopředseda</option><option>Pověřená osoba</option></select>

<label>Podpis příjemce</label><canvas id="recipientSig"></canvas>
<div class="actions"><button class="danger" type="button" id="clearRecipient">Vymazat podpis</button></div>

<label>Podpis za Edennium</label><canvas id="edenniumSig"></canvas>
<div class="actions"><button class="danger" type="button" id="clearEdennium">Vymazat podpis</button></div>

<label style="display:flex;gap:9px;align-items:flex-start;font-weight:400">
<input id="confirmed" type="checkbox" style="width:auto;margin-top:3px">
<span>Potvrzuji správnost údajů uvedených v tomto dokladu.</span>
</label>

<div class="actions">
<button type="button" class="secondary" id="copyLink">📋 Kopírovat odkaz</button>
<button type="button" class="secondary" id="shareLink">🔗 Poslat k podpisu</button>
<button type="button" class="primary" id="pdf">📄 Vytvořit PDF potvrzení</button>
</div>
<div id="statusBox"></div>
</div></main>

<script>
function show(msg){const e=document.getElementById('statusBox');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',6000)}
function setupCanvas(id){
 const c=document.getElementById(id),ctx=c.getContext('2d');let drawing=false,hasInk=false,last;
 function resize(){const r=c.getBoundingClientRect();const d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2;ctx.lineCap='round';}
 resize();window.addEventListener('resize',resize);
 function pos(ev){const r=c.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
 c.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;hasInk=true});
 c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false);
 return {canvas:c,clear(){ctx.clearRect(0,0,c.width,c.height);hasInk=false},has(){return hasInk}};
}
const recipient=setupCanvas('recipientSig'), edennium=setupCanvas('edenniumSig');
document.getElementById('clearRecipient').onclick=()=>recipient.clear();
document.getElementById('clearEdennium').onclick=()=>edennium.clear();

function updateStatus(){
 const s=document.getElementById('paymentStatus').value,d=document.getElementById('payDate'),l=document.getElementById('dateLabel'),h=document.getElementById('statusHint');
 if(s==='cash_paid'){l.textContent='Datum vyplacení';d.disabled=false;h.textContent='Podpis příjemce zároveň potvrzuje převzetí uvedené hotovosti.'}
 else if(s==='transfer_pending'){l.textContent='Datum úhrady (zatím nevyplňovat)';d.value='';d.disabled=true;h.textContent='Částka dosud nebyla vyplacena. Podpis potvrzuje správnost údajů a souhlas s následným vyplacením.'}
 else{l.textContent='Datum úhrady';d.disabled=false;h.textContent='Bankovní převod již proběhl; samotnou úhradu prokazuje bankovní výpis.'}
}
document.getElementById('paymentStatus').onchange=updateStatus;updateStatus();

function buildLink(){
 const q=new URLSearchParams();
 ['docNo','name','purpose','amount','paymentStatus'].forEach(id=>{const v=document.getElementById(id).value;if(v)q.set(id,v)});
 return location.origin+location.pathname+'?'+q.toString();
}
function shareReady(){return ['docNo','name','purpose','amount'].every(id=>document.getElementById(id).value.trim())}
document.getElementById('copyLink').onclick=async()=>{
 if(!shareReady()){alert('Před sdílením vyplňte číslo dokladu, příjemce, účel platby a částku.');return}
 const u=buildLink();try{await navigator.clipboard.writeText(u);show('Odkaz byl zkopírován do schránky.')}catch(e){prompt('Zkopírujte tento odkaz:',u)}
};
document.getElementById('shareLink').onclick=async()=>{
 if(!shareReady()){alert('Před sdílením vyplňte číslo dokladu, příjemce, účel platby a částku.');return}
 const u=buildLink();
 if(navigator.share){try{await navigator.share({title:'Platby Edennium – doklad k podpisu',text:'Prosím zkontrolujte předvyplněný doklad a potvrďte jej podpisem.',url:u});return}catch(e){}}
 try{await navigator.clipboard.writeText(u);show('Sdílení není dostupné; odkaz byl zkopírován.')}catch(e){prompt('Zkopírujte odkaz:',u)}
};

const q=new URLSearchParams(location.search);let pre=false;
['docNo','name','purpose','amount','paymentStatus'].forEach(id=>{const v=q.get(id);if(v!==null){document.getElementById(id).value=v;pre=true}});
updateStatus();if(pre)show('Doklad byl předvyplněn k podpisu. Zkontrolujte údaje, podepište jej a vytvořte PDF.');

function esc(v){return String(v).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}
document.getElementById('pdf').onclick=()=>{
 const docNo=document.getElementById('docNo').value.trim(),name=document.getElementById('name').value.trim(),purpose=document.getElementById('purpose').value.trim(),amount=document.getElementById('amount').value.trim(),status=document.getElementById('paymentStatus').value,date=document.getElementById('payDate').value,issuer=document.getElementById('issuer').value,confirmed=document.getElementById('confirmed').checked;
 if(!docNo||!name||!purpose||!amount||!issuer||!confirmed||!recipient.has()||!edennium.has()){alert('Vyplňte všechny údaje, oba podpisy a potvrzení.');return}
 if(status!=='transfer_pending'&&!date){alert('U vyplacené platby vyplňte datum úhrady nebo vyplacení.');return}
 const statusText=status==='cash_paid'?'Hotově – vyplaceno':status==='transfer_pending'?'Bankovním převodem – k vyplacení':'Bankovním převodem – vyplaceno';
 const method=status==='cash_paid'?'Hotově':'Bankovním převodem';
 const statement=status==='cash_paid'?'Podpisem zároveň potvrzuji převzetí uvedené částky v hotovosti.':status==='transfer_pending'?'Uvedená částka dosud nebyla vyplacena; podpisem potvrzuji správnost údajů a souhlas s jejím následným vyplacením.':'Uvedená částka byla uhrazena bankovním převodem; samotnou úhradu prokazuje bankovní výpis.';
 const rs=recipient.canvas.toDataURL(),es=edennium.canvas.toDataURL();
 const w=window.open('','_blank');if(!w){alert('Pro vytvoření PDF povolte v prohlížeči otevírání nových oken.');return}
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(docNo)}</title><style>body{font-family:Arial;padding:45px;line-height:1.5}h1{font-size:24px}.box{border:1px solid #ccc;padding:16px;margin:18px 0}.sigs{display:flex;gap:80px;margin-top:40px}.sig{width:40%;text-align:center}.sig img{max-width:100%;height:100px;object-fit:contain;border-bottom:1px solid #444}</style></head><body>
 <h1>POTVRZENÍ O PLATBĚ</h1><p><b>Edennium, z.s.</b><br>IČO: 08142408</p>
 <div class="box"><b>Číslo dokladu:</b> ${esc(docNo)}<br><b>Příjemce:</b> ${esc(name)}<br><b>Účel platby:</b> ${esc(purpose)}<br><b>Částka:</b> ${esc(amount)} Kč<br><b>Způsob úhrady:</b> ${method}<br><b>Stav platby:</b> ${statusText}${date?'<br><b>Datum úhrady / vyplacení:</b> '+esc(date):''}</div>
 <div class="box">Já, <b>${esc(name)}</b>, potvrzuji správnost údajů uvedených v tomto dokladu a souhlasím s vyplacením částky <b>${esc(amount)} Kč</b> za <b>${esc(purpose)}</b>.<br><br>${statement}</div>
 <div class="sigs"><div class="sig"><img src="${rs}"><br><b>${esc(name)}</b><br>Příjemce</div><div class="sig"><img src="${es}"><br><b>${esc(issuer)}</b><br>Za Edennium, z.s.</div></div>
 <p style="margin-top:45px;font-size:12px">Datum vystavení: ${new Date().toLocaleDateString('cs-CZ')}<br>Identifikátor dokladu: ${esc(docNo)}</p>
 <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
 w.document.close();
};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body></html>
